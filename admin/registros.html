<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registros - DDE</title>
  <link rel="stylesheet" href="../assets/css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="navbar">
  <span class="brand">DDE - Panel Admin</span>
  <div class="links">
    <a href="dashboard.html">Dashboard</a>
    <a href="registros.html">Registros</a>
    <a class="btn-salir" href="#" id="btnSalir">Salir</a>
  </div>
</nav>

<main class="contenedor">
  <h1>Registros de Entrevistas</h1>

  <form class="filtros" id="formFiltros">
    <select id="tipo">
      <option value="todos">Todos los registros</option>
      <option value="dia">Por día</option>
      <option value="mes">Por mes</option>
      <option value="anio">Por año</option>
    </select>
    <input type="date" id="fechaDia">
    <input type="month" id="fechaMes">
    <input type="number" id="fechaAnio" min="2020" max="2100">
    <button type="submit">Buscar</button>
    <button type="button" id="btnExportar" style="background:#2e7d32;">Exportar CSV</button>
  </form>

  <p><strong>Total: <span id="total">0</span> registros</strong></p>

  <table>
    <thead>
      <tr>
        <th>Turno</th>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Nombre</th>
        <th>CI</th>
        <th>Celular</th>
        <th>Rol</th>
        <th>Motivo</th>
        <th>Funcionario</th>
        <th>Observaciones</th>
        <th>Estado / Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaRegistros"></tbody>
  </table>
</main>

<script src="../assets/js/supabase-client.js"></script>
<!-- Cambiamos la versión para forzar actualización -->
<script src="../assets/js/registros.js?v=108"></script>
</body>
</html>
