<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Entrevistas - DDE</title>
  <link rel="stylesheet" href="assets/css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="contenedor">
  <header>
    <h1>Direccion Distrital de Educacion</h1>
    <h2>Registro Digital de Entrevistas</h2>
    <div class="stats" id="stats">
      <div class="stat"><strong id="statHoy">-</strong><span>Registrados</span></div>
      <div class="stat"><strong id="statEspera">-</strong><span>En espera</span></div>
    </div>
  </header>

  <form id="formRegistro" autocomplete="off">
    <div class="grid-2">
      <div class="campo"><label>Nombre completo *</label>
        <input type="text" id="nombre" required minlength="3" maxlength="150"></div>
      <div class="campo"><label>CI / Documento *</label>
        <input type="text" id="ci" required maxlength="8" minlength="6" pattern="[0-9]{6,8}" title="El CI debe tener entre 6 y 8 números" placeholder="Ej: 123456"></div>
      <div class="campo"><label>Celular</label>
        <input type="tel" id="telefono" maxlength="8" minlength="8" pattern="[0-9]{8}" title="El celular debe tener exactamente 8 números" placeholder="Ej: 71234567"></div>
      <div class="campo"><label>Motivo *</label>
        <select id="motivo" required>
          <option value="">-- Seleccione --</option>
          <option>Consulta</option>
          <option>Reclamo</option>
          <option>Entrega de documentos</option>
          <option>Solicitud de informacion</option>
          <option>Denuncia</option>
          <option>Otro</option>
        </select></div>
      
      <div class="campo">
        <label>Usted es: *</label>
        <select id="rol" required>
          <option value="">-- Seleccione --</option>
          <option value="Padre/Madre/Tutor">Padre, Madre o Tutor</option>
          <option value="Estudiante">Estudiante</option>
          <option value="Maestro/Administrativo">Maestro / Personal Administrativo</option>
          <option value="Director">Director de Unidad Educativa</option>
          <option value="Externo/Otro">Externo / Otro</option>
        </select>
      </div>
      
      <!-- LISTA DE ÁREAS DE DESTINO ACTUALIZADA -->
      <div class="campo">
        <label>Funcionario o área de destino *</label>
        <select id="area" required>
          <option value="">-- Seleccione el área --</option>
          <option value="Dirección">Dirección</option>
          <option value="Secretaría">Secretaría</option>
          <option value="Recursos Humanos">Recursos Humanos</option>
          <option value="Asesoría Legal">Asesoría Legal</option>
          <option value="Sistema de Información Educativa">Sistema de Información Educativa</option>
          <option value="Seguimiento">Seguimiento</option>
          <option value="Caja">Caja</option>
          <option value="Alternativa y Especial">Alternativa y Especial</option>
          <option value="Orientación">Orientación</option>
        </select>
      </div>
        
      <div class="campo">
        <label>Fecha de atención deseada *</label>
        <input type="date" id="fechaAtencion" required>
        <small style="color:#777; font-size:11px; margin-top:3px;">Elija un día hábil (Lun a Vie)</small>
      </div>

      <div class="campo">
        <label>Hora de atención deseada *</label>
        <input type="time" id="horaAtencion" min="08:00" max="16:00" required>
        <small style="color:#777; font-size:11px; margin-top:3px;">Horario: 08:00 a 16:00</small>
      </div>
    </div>
    
    <div class="campo">
      <label>Descripción breve de su caso *</label>
      <textarea id="observaciones" rows="3" maxlength="150" required placeholder="Explique brevemente qué necesita resolver (máx. 150 caracteres)"></textarea>
    </div>
    
    <div class="fecha-hora">
      Fecha: <span id="fechaActual"></span> | Hora: <span id="horaActual"></span>
    </div>
    <button type="submit" id="btnRegistrar">Registrar Entrevista</button>
  </form>
  <div id="mensaje" class="mensaje"></div>
  <a class="link-admin" href="admin/login.html">Acceso Administrador</a>
</div>
<script src="assets/js/supabase-client.js"></script>
<!-- Versión actualizada a 113 -->
<script src="assets/js/app.js?v=114"></script>
</body>
</html>
